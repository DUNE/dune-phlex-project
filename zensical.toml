[project]
site_name = "DUNE Phlex Project"
site_description = "Workflow reference, data hierarchy design, and conventions for DUNE-facing Phlex work"
site_url = "https://dune.github.io/dune-phlex-project/"
repo_url = "https://github.com/DUNE/dune-phlex-project"
repo_name = "DUNE/dune-phlex-project"

nav = [
  { "Home" = "index.md" },
  { "Subsystem workflows" = [
      { "Overview" = "subsystems/index.md" },
      { "protoDUNE" = "subsystems/protodune.md" },
      { "ND prototypes" = "subsystems/nd-prototypes.md" },
      { "ND sim/reco: ND-LAr+TMS" = "subsystems/nd-lar-tms.md" },
      { "ND sim/reco: SAND" = "subsystems/sand.md" },
      { "FD sim/reco: TPC" = "subsystems/fd-tpc.md" },
      { "FD sim/reco: PDS" = "subsystems/fd-pds.md" },
    ] },
  { "Hierarchy model" = "hierarchy-model.md" },
  { "Conventions" = [
      { "Overview" = "conventions/index.md" },
      { "Units (CLHEP)" = "conventions/units.md" },
      { "Timestamps" = "conventions/timestamps.md" },
      { "Python" = "conventions/python.md" },
    ] },
  { "Ecosystem: dune-xerosere" = "ecosystem.md" },
  { "Migration status" = "migration-status.md" },
  { "Repositories" = "repositories.md" },
  { "Contributing" = "contributing.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
logo = "images/dune-logo.jpeg"
favicon = "images/favicon.png"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
tables = {}
footnotes = {}
attr_list = {}
md_in_html = {}
admonition = {}
toc = {
  permalink = true
}
pymdownx.details = {}
pymdownx.superfences = {
  custom_fences = [
    { name = "mermaid", class = "mermaid" }
  ]
}
pymdownx.highlight = {
  anchor_linenums = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
